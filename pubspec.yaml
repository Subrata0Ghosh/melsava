name: melsava
description: "MELSAVA - Meet through moments. A dating app focused on shared experiences."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Backend
  supabase_flutter: ^2.9.0

  # Media
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.20.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  http: ^1.2.2

  # Environment variables
  flutter_dotenv: ^5.2.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  share_plus: ^13.3.1
  geolocator: ^14.1.2
  google_sign_in: ^7.2.0

  # End-to-End Encryption & Native Secure Storage
  libsignal_protocol_dart: ^0.8.2
  flutter_secure_storage: ^11.2.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#292332"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icon/

